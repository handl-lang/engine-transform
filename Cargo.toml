[package]
name = "hnl-engine-transform"
version = "0.1.0"
edition = "2024"
description = "The abstraction crate for the AST transform operation (ADR-0094)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-transform"
homepage = "https://handl-lang.github.io/docs/engine-transform/"
documentation = "https://handl-lang.github.io/docs/engine-transform/reference/"
readme = "README.md"
keywords = ["handl", "engine", "transform", "rewrite", "language-as-data"]
categories = ["compilers", "development-tools"]
# Git-install only: https://github.com/handl-lang/engine-transform (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

